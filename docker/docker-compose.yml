version: '3.8'

# Nur fuer die lokale Entwicklung: Backend und Frontend laufen lokal, nur die Datenbank in Docker.
# Der Betrieb liegt im Verzeichnis betrieb/.
# Start: docker compose up

services:
  postgres-dev:
    image: postgres:16
    container_name: cashcontrol-db-dev
    ports:
      - 5431:5432
    environment:
      - POSTGRES_PASSWORD=secret
      - POSTGRES_USER=cashcontrol
      - POSTGRES_DB=cashcontrol
    volumes:
      - cashcontrol-db-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashcontrol -d cashcontrol"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cashcontrol-db-dev:
    name: cashcontrol-db-dev
