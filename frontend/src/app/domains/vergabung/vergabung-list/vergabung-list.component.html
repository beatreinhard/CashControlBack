<div class="table-wrap">
  <table mat-table [dataSource]="dataSource" matSort>

    <!-- Jahr -->
    <ng-container matColumnDef="jahr">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Jahr</th>
      <td mat-cell *matCellDef="let v">{{ v.jahr }}</td>
    </ng-container>

    <!-- Datum (Spaltenname = Feldname, damit die Sortierung greift) -->
    <ng-container matColumnDef="zahlungsDatum">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Datum</th>
      <td mat-cell *matCellDef="let v">{{ v.zahlungsDatum | date:'EEE, dd.MM.yyyy' }}</td>
    </ng-container>

    <!-- Empfänger -->
    <ng-container matColumnDef="empfaenger">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Empfänger</th>
      <td mat-cell *matCellDef="let v">{{ v.empfaenger }}</td>
    </ng-container>

    <!-- Betrag -->
    <ng-container matColumnDef="betrag">
      <th mat-header-cell *matHeaderCellDef mat-sort-header arrowPosition="before" class="right">Betrag</th>
      <td mat-cell *matCellDef="let v" class="right">{{ v.betrag | number:'1.2-2' }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  </table>

  <mat-paginator [pageSize]="10" [pageSizeOptions]="[5,10,25,50]" showFirstLastButtons></mat-paginator>
</div>
