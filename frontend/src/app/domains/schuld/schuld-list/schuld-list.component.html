<div class="table-wrap">
  <table mat-table [dataSource]="dataSource" matSort>

    <!-- Jahr -->
    <ng-container matColumnDef="jahr">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Jahr</th>
      <td mat-cell *matCellDef="let s">{{ s.jahr }}</td>
    </ng-container>

    <!-- Art -->
    <ng-container matColumnDef="art">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Art</th>
      <td mat-cell *matCellDef="let s">
        <mat-chip-set>
          <mat-chip>{{ s.art }}</mat-chip>
        </mat-chip-set>
      </td>
    </ng-container>

    <!-- Gläubiger -->
    <ng-container matColumnDef="glaeubiger">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Gläubiger</th>
      <td mat-cell *matCellDef="let s">{{ s.glaeubiger }}</td>
    </ng-container>

    <!-- Text -->
    <ng-container matColumnDef="text">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Text</th>
      <td mat-cell *matCellDef="let s">{{ s.text }}</td>
    </ng-container>

    <!-- Betrag -->
    <ng-container matColumnDef="betrag">
      <th mat-header-cell *matHeaderCellDef mat-sort-header arrowPosition="before" class="right">Betrag</th>
      <td mat-cell *matCellDef="let s" class="right">{{ s.betrag | number:'1.2-2' }}</td>
    </ng-container>

    <!-- Zinsen -->
    <ng-container matColumnDef="zinsen">
      <th mat-header-cell *matHeaderCellDef mat-sort-header arrowPosition="before" class="right">Zinsen</th>
      <td mat-cell *matCellDef="let s" class="right">{{ s.zinsen | number:'1.2-2' }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr
      mat-row
      class="clickable-row"
      *matRowDef="let row; columns: displayedColumns;"
      tabindex="0"
      [attr.aria-label]="'Schuld ' + row.jahr + ' bei ' + row.glaeubiger + ' bearbeiten'"
      (click)="selectRow(row)"
      (keydown.enter)="selectRow(row)"
      (keydown.space)="$event.preventDefault(); selectRow(row)">
    </tr>

  </table>

  <mat-paginator [pageSize]="10" [pageSizeOptions]="[5,10,25,50]" showFirstLastButtons></mat-paginator>
</div>
