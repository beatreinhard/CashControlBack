<div class="table-wrap">
  <table mat-table [dataSource]="dataSource" matSort>

    <!-- Jahr -->
    <ng-container matColumnDef="jahr">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Jahr</th>
      <td mat-cell *matCellDef="let b">{{ b.jahr }}</td>
    </ng-container>

    <!-- Arbeitnehmer -->
    <ng-container matColumnDef="arbeitnehmerName">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Arbeitnehmer</th>
      <td mat-cell *matCellDef="let b">{{ b.arbeitnehmerName }}</td>
    </ng-container>

    <!-- Arbeitgeber -->
    <ng-container matColumnDef="arbeitgeber">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Arbeitgeber</th>
      <td mat-cell *matCellDef="let b">{{ b.arbeitgeber }}</td>
    </ng-container>

    <!-- Arbeitsort -->
    <ng-container matColumnDef="arbeitsort">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Arbeitsort</th>
      <td mat-cell *matCellDef="let b">{{ b.arbeitsort }}</td>
    </ng-container>

    <!-- Beschäftigungsgrad -->
    <ng-container matColumnDef="beschaeftigungsgrad">
      <th mat-header-cell *matHeaderCellDef mat-sort-header arrowPosition="before" class="right">Pensum</th>
      <td mat-cell *matCellDef="let b" class="right">{{ b.beschaeftigungsgrad }} %</td>
    </ng-container>

    <!-- Arbeitstage -->
    <ng-container matColumnDef="arbeitstage">
      <th mat-header-cell *matHeaderCellDef mat-sort-header arrowPosition="before" class="right">Arbeitstage</th>
      <td mat-cell *matCellDef="let b" class="right">{{ b.arbeitstage }}</td>
    </ng-container>

    <!-- Fahrtkilometer pro Tag -->
    <ng-container matColumnDef="fahrtkilometerProTag">
      <th mat-header-cell *matHeaderCellDef mat-sort-header arrowPosition="before" class="right">km/Tag</th>
      <td mat-cell *matCellDef="let b" class="right">{{ b.fahrtkilometerProTag | number }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr
      mat-row
      class="clickable-row"
      *matRowDef="let row; columns: displayedColumns;"
      tabindex="0"
      [attr.aria-label]="'Beruf ' + row.jahr + ' bei ' + row.arbeitgeber + ' bearbeiten'"
      (click)="selectRow(row)"
      (keydown.enter)="selectRow(row)"
      (keydown.space)="$event.preventDefault(); selectRow(row)">
    </tr>

  </table>

  <mat-paginator [pageSize]="10" [pageSizeOptions]="[5,10,25,50]" showFirstLastButtons></mat-paginator>
</div>
