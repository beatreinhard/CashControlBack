<h1 class="page-title">Reporting</h1>

<mat-card class="reporting-card">
  <mat-card-title>PDF generieren</mat-card-title>
  <mat-card-content>
    <p>Erstellt den PDF-Bericht und öffnet ihn in einem neuen Tab.</p>
    @if (generatePdfInProgress()) {
      <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    }
  </mat-card-content>
  <mat-card-actions align="end">
    <button mat-flat-button color="primary" type="button" [disabled]="generatePdfInProgress()" (click)="pdfGenerieren()">
      PDF generieren
    </button>
  </mat-card-actions>
</mat-card>
