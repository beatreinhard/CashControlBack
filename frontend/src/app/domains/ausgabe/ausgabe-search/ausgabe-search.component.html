<mat-form-field class="search">
  <mat-label>Suchen (Empfänger, Kategorie, Zahlender)</mat-label>
  <input matInput type="search" [value]="searchTerm()" (input)="onSearch($event)" />
</mat-form-field>

@if (loading()) {
  <mat-progress-spinner mode="indeterminate" diameter="36"></mat-progress-spinner>
} @else if (error()) {
  <p class="error">{{ error() }}</p>
} @else {
  <app-ausgabe-list
    [items]="result()"
    (ausgabeSelected)="openAusgabe($event)">
  </app-ausgabe-list>
}
