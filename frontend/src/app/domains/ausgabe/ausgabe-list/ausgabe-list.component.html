<div class="table-wrap">
  <table mat-table [dataSource]="dataSource" matSort>

    <!-- Datum -->
    <ng-container matColumnDef="datum">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Datum</th>
      <td mat-cell *matCellDef="let a">{{ a.datum | date:'EEE, dd.MM.yyyy' }}</td>
    </ng-container>

    <!-- Zahlender -->
    <ng-container matColumnDef="zahlender">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Zahlender</th>
      <td mat-cell *matCellDef="let a">{{ a.zahlenderName | fullName:a.zahlenderVorname }}</td>
    </ng-container>

    <!-- Empfänger -->
    <ng-container matColumnDef="empfaenger">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Empfänger</th>
      <td mat-cell *matCellDef="let a">{{ a.empfaenger }}</td>
    </ng-container>

    <!-- Kategorie -->
    <ng-container matColumnDef="kategorie">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Kategorie</th>
      <td mat-cell *matCellDef="let a">
        <mat-chip-set>
          <mat-chip>{{ a.kategorie }}</mat-chip>
        </mat-chip-set>
      </td>
    </ng-container>

    <!-- Betrag -->
    <ng-container matColumnDef="betrag">
      <th mat-header-cell *matHeaderCellDef mat-sort-header arrowPosition="before" class="right">Betrag</th>
      <td mat-cell *matCellDef="let a" class="right">{{ a.betrag | number:'1.2-2' }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr
      mat-row
      class="clickable-row"
      *matRowDef="let row; columns: displayedColumns;"
      tabindex="0"
      [attr.aria-label]="'Ausgabe an ' + row.empfaenger + ' bearbeiten'"
      (click)="selectRow(row)"
      (keydown.enter)="selectRow(row)"
      (keydown.space)="$event.preventDefault(); selectRow(row)">
    </tr>

  </table>

  <mat-paginator [pageSize]="10" [pageSizeOptions]="[5,10,25,50]" showFirstLastButtons></mat-paginator>
</div>
