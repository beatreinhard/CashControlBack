<div class="table-wrap">
  <table mat-table [dataSource]="dataSource" matSort>

    <!-- Jahr -->
    <ng-container matColumnDef="jahr">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Jahr</th>
      <td mat-cell *matCellDef="let g">{{ g.jahr }}</td>
    </ng-container>

    <!-- Rechnungsdatum -->
    <ng-container matColumnDef="rgDatum">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Rechnungsdatum</th>
      <td mat-cell *matCellDef="let g">{{ g.rgDatum | date:'dd.MM.yyyy' }}</td>
    </ng-container>

    <!-- Ausführende Firma -->
    <ng-container matColumnDef="ausfuehrendeFirma">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Firma</th>
      <td mat-cell *matCellDef="let g">{{ g.ausfuehrendeFirma }}</td>
    </ng-container>

    <!-- Arbeitsart -->
    <ng-container matColumnDef="arbeitsArt">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Arbeitsart</th>
      <td mat-cell *matCellDef="let g">{{ g.arbeitsArt }}</td>
    </ng-container>

    <!-- Betrag netto -->
    <ng-container matColumnDef="betragNetto">
      <th mat-header-cell *matHeaderCellDef mat-sort-header arrowPosition="before" class="right">Betrag netto</th>
      <td mat-cell *matCellDef="let g" class="right">{{ g.betragNetto | number:'1.2-2' }}</td>
    </ng-container>

    <!-- Anteil andere Kosten -->
    <ng-container matColumnDef="anteilAndereKosten">
      <th mat-header-cell *matHeaderCellDef mat-sort-header arrowPosition="before" class="right">Andere Kosten</th>
      <td mat-cell *matCellDef="let g" class="right">{{ g.anteilAndereKosten | number:'1.2-2' }}</td>
    </ng-container>

    <!-- Anteil Unterhalt -->
    <ng-container matColumnDef="anteilUnterhalt">
      <th mat-header-cell *matHeaderCellDef mat-sort-header arrowPosition="before" class="right">Unterhalt</th>
      <td mat-cell *matCellDef="let g" class="right">{{ g.anteilUnterhalt | number:'1.2-2' }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr
      mat-row
      class="clickable-row"
      *matRowDef="let row; columns: displayedColumns;"
      tabindex="0"
      [attr.aria-label]="'Grundstückunterhalt ' + row.jahr + ' von ' + row.ausfuehrendeFirma + ' bearbeiten'"
      (click)="selectRow(row)"
      (keydown.enter)="selectRow(row)"
      (keydown.space)="$event.preventDefault(); selectRow(row)">
    </tr>

  </table>

  <mat-paginator [pageSize]="10" [pageSizeOptions]="[5,10,25,50]" showFirstLastButtons></mat-paginator>
</div>
