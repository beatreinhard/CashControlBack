openapi: 3.0.4
info:
  title: CashControl API
  version: 1.0.0
  description: REST-API
servers:
  - url: http://localhost:8080
    description: Lokaler Server

tags:
  - name: AusgabeController
    description: Endpoints für Ausgaben
  - name: VergabungController
    description: Endpoints für Vergabungen
  - name: SchuldController
    description: Endpoints für Schulden
  - name: BerufController
    description: Endpoints für Beruf
  - name: ErbschaftController
    description: Endpoints für Erbschaft
  - name: GrundstueckunterhaltController
    description: Endpoints für Grundstueckunterhalt
  - name: ReportingController
    description: Endpoints für Reporting

paths:
  /api/v1/ausgabe:
    get:
      tags: [AusgabeController]
      operationId: getAllAusgabeView
      summary: Alle Ausgaben mit Name, Vorname der Person als Zahlender
      responses:
        '200':
          description: Alle Ausgaben gefunden
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AusgabeViewDto'
    post:
      tags: [AusgabeController]
      operationId: createAusgabe
      summary: Neue Ausgabe erfassen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AusgabeDto'
      responses:
        '201':
          description: Ausgabe erfasst (ID im Response-Body)
          content:
            text/plain:
              schema:
                type: string
                description: ID der neu erstellten Ausgabe

  /api/v1/ausgabe/{id}:
    get:
      tags: [AusgabeController]
      operationId: getAusgabeById
      summary: Ausgabe finden mit ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Ausgabe mit ID gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AusgabeDto'
        '404':
          description: Ausgabe nicht gefunden
    delete:
      tags: [AusgabeController]
      operationId: deleteAusgabeById
      summary: Ausgabe löschen mit ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Ausgabe gelöscht (kein Response-Body)
        '404':
          description: Ausgabe nicht gefunden
    put:
      tags: [AusgabeController]
      operationId: updateAusgabe
      summary: Ausgabe aktualisieren
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AusgabeDto'
      responses:
        '204':
          description: Ausgabe aktualisiert (kein Response-Body)
        '404':
          description: Ausgabe nicht gefunden

  /api/v1/vergabung:
    get:
      tags: [VergabungController]
      operationId: getVergabungen
      summary: Gibt Vergabungen (wenn gewollt mit Jahr als Filter)
      parameters:
      - in: query
        name: jahr
        schema:
          type: integer
      description: Filter nach Jahr
      responses:
