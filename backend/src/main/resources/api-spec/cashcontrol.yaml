components:
  schemas:
    AusgabeDto:
      title: Ausgabe
      type: object
      description: Datentransferobjekt einer Ausgabe
      properties:
        id:
          type: string
          description: Technische ID (bei Create optional)
          example: "a8f1c7d2-1b3e-4f0a-97f9-1b1e9f6b5c2a"
        datum:
          type: string
          format: date
          description: Buchungs-/Belegdatum
          example: "2025-08-15"
        zahlender:
          type: string
          description: Id zur Person (Fremdschlüssel)
          example: "a8f1c7d2-1b3e-4f0a-97f9-1b1e9f6b5c2a"
        empfaenger:
          type: string
          description: Empfänger
          example: "Coop"
        kategorie:
          $ref: '#/components/schemas/AusgabeKategorieDto'
        text:
          type: string
          description: Beschreibung/Notiz
          example: "Wocheneinkauf"
        betrag:
          type: number
          description: Betrag (positiv für Ausgaben)
          example: 86.45
      required:
        - datum
        - empfaenger
        - kategorie
        - text
        - betrag

    AusgabeViewDto:
      title: AusgabeView
      type: object
      description: Datentransferobjekt einer Ausgabe mit Personendaten
      properties:
        id:
          type: string
          description: Technische ID (bei Create optional)
          example: "a8f1c7d2-1b3e-4f0a-97f9-1b1e9f6b5c2a"
        datum:
          type: string
          format: date
          description: Buchungs-/Belegdatum
          example: "2025-08-15"
        zahlender:
          type: string
          description: Id zur Person (Fremdschlüssel)
          example: "a8f1c7d2-1b3e-4f0a-97f9-1b1e9f6b5c2a"
        empfaenger:
          type: string
          description: Empfänger
          example: "Coop"
        kategorie:
          $ref: '#/components/schemas/AusgabeKategorieDto'
        betrag:
          type: number
          description: Betrag (positiv für Ausgaben)
          example: 86.45
        zahlenderName:
          type: string
          description: Zahlender (Name der Person)
          example: "Muster"
        zahlenderVorname:
          type: string
          description: Zahlender (Vorname der Person)
          example: "Hans"
      required:
        - id
        - datum
        - empfaenger
        - kategorie
        - betrag

    AusgabeKategorieDto:
      type: string
      description: Kategorie der Ausgabe
      enum:
        - VERKEHR_AUTO_TRANSPORT
        - HAUSHALT
        - FERIEN
        - KOMMUNIKATION_MEDIEN
        - UNFALL_KRANKHEIT
        - PERSOENLICHE_AUSGABEN
        - SPAREN_VORSORGE
        - STEUERN
        - SPENDEN
        - KRANKENKASSE
        - BERUF
        - BANKGEBUEHREN
        - LIEGENSCHAFT_BETRIEB
        - DIVERSES

    VergabungDto:
      title: Vergabung
      type: object
      description: Datentransferobjekt einer Vergabung
      properties:
        id:
          type: string
          description: Technische ID (bei Create optional)
          example: "5c2a1b1e-97f9-4f0a-1b3e-a8f1c7d21b3e"
        jahr:
          type: integer
          format: int32
          description: Steuerjahr der Vergabung
          example: 2025
        zahlungsDatum:
          type: string
          format: date
          description: Datum der Zahlung
          example: "2025-03-31"
        empfaenger:
          type: string
          description: Empfänger der Vergabung
          example: "Gemeinde Bern"
        betrag:
          type: number
          description: Betrag der Vergabung
          example: 250.00
      required:
        - jahr
        - zahlungsDatum
        - empfaenger
        - betrag

    SchuldDto:
      title: Schuld
      type: object
      description: Datentransferobjekt einer Schuld
      properties:
        id:
          type: string
          description: Technische ID (bei Create optional)
          example: "a8f1c7d2-1b3e-4f0a-97f9-1b1e9f6b5c2a"
        jahr:
          type: integer
          format: int32
          description: Steuerjahr der Schuld
          example: 2025
        art:
          $ref: '#/components/schemas/SchuldArtDto'
        glaeubiger:
          type: string
          description: Gläubiger
          example: "Steuerverwaltung"
        text:
          type: string
          description: Text
          example: "Depogebühr"
        betrag:
          type: number
          description: Betrag (positiv für Schuld)
          example: 850.45
        zinsen:
          type: number
          description: Zinsen (positiv für Schuld)
          example: 10.20
      required:
        - jahr
        - art
        - glaeubiger
        - betrag

    SchuldArtDto:
      type: string
      description: Art der Schuld
      enum:
        - RECHNUNG
        - HYPOTHEK
        -

    BerufDto:
      title: Beruf
      type: object
      description: Datentransferobjekt eines Berufs
      properties:
        id:
          type: string
          description: Technische ID (bei Create optional)
          example: "5c2a1b1e-97f9-4f0a-1b3e-a8f1c7d21b3e"
        jahr:
          type: integer
          format: int32
          description: Steuerjahr des Berufs
          example: 2025
        arbeitnehmer:
          type: string
          description: Name des Arbeitnehmers
          example: "Beat Reinhard"
        arbeitgeber:
          type: string
          description: Name des Arbeitgebers
          example: "Muster AG"
        arbeitsort:
          type: string
          description: Ort der Arbeitsstätte
          example: "Bern"
        beschaeftigungsgrad:
          type: integer
          format: int32
          description: Beschäftigungsgrad in Prozent
          example: 100
        arbeitstage:
          type: integer
          format: int32
          description: Anzahl Arbeitstage pro Jahr
          example: 220
        fahrtkilometerProTag:
          type: integer
          format: int32
          description: Fahrtkilometer pro Arbeitstag
          example: 20
        grundAutobenutzung:
          type: string
          description: Grund für Autobenutzung statt öffentlichem Verkehr
          example: "Kein ÖV-Anschluss"
        ansatzAuswaertigeVerpflegung:
