spring:
  application:
    name: cashcontrol-service
  datasource:
    driver-class-name: org.postgresql.Driver
  flyway:
    locations: classpath:db/migration/
    clean-on-validation-error: false
    default-schema: cashcontrol
  jpa:
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate    # validiert das Schema mit den Entities beim Starten der Applikation
  thymeleaf:
    prefix: classpath:/templates/reporting/
    suffix: .html
    mode: HTML
    encoding: UTF-8
server:
  port: 8080
  servlet:
    context-path: /cash-control
  compression:
    enabled: true

logging:
  pattern:
    level: '[%X{correlationId}] %5p'
