<nav th:fragment="schuld">
    <h2>Schulden</h2>
    <h3>Rechnungen</h3>
    <p class="leer" th:if="${var.getRechnungen().isEmpty()}">Keine Einträge</p>
    <table th:unless="${var.getRechnungen().isEmpty()}">
        <tr>
            <th>Gläubiger</th>
            <th>Text</th>
            <th class="right">Betrag</th>
        </tr>
        <tr th:each="rechnung : ${var.getRechnungen()}">
            <td th:text="${rechnung.getGlaeubiger()}"></td>
            <td th:text="${rechnung.getText()}"></td>
            <td class="right" th:text="${var.chf(rechnung.getBetrag())}"></td>
        </tr>
        <tr class="total">
            <td colspan="2">Total</td>
            <td class="right" th:text="${var.chf(var.getRechnungenTotal())}"></td>
        </tr>
    </table>
    <h3>Hypotheken</h3>
    <p class="leer" th:if="${var.getHypotheken().isEmpty()}">Keine Einträge</p>
    <table th:unless="${var.getHypotheken().isEmpty()}">
        <tr>
            <th>Gläubiger</th>
            <th>Text</th>
            <th class="right">Betrag</th>
            <th class="right">Zinsen</th>
        </tr>
        <tr th:each="hyp : ${var.getHypotheken()}">
            <td th:text="${hyp.getGlaeubiger()}"></td>
            <td th:text="${hyp.getText()}"></td>
            <td class="right" th:text="${var.chf(hyp.getBetrag())}"></td>
            <td class="right" th:text="${var.chf(hyp.getZinsen())}"></td>
        </tr>
        <tr class="total">
            <td colspan="2">Total</td>
            <td class="right" th:text="${var.chf(var.getHypothekenTotal())}"></td>
            <td class="right" th:text="${var.chf(var.getHypothekenZinsenTotal())}"></td>
        </tr>
    </table>
</nav>
