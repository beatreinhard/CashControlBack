<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
    <head>
        <title th:text="'Steuerrechnung ' + ${var.getJahr()}">Steuerrechnung</title>
        <style>
            @page { size: A4; margin: 15mm; }
            body { font-family: Helvetica, Arial, sans-serif; font-size: 9pt; color: #222; }
            h1 { text-align: center; color: green; font-size: 18pt; margin: 0 0 12pt; }
            h2 { font-size: 12pt; color: green; border-bottom: 1px solid green; margin: 16pt 0 6pt; padding-bottom: 2pt; }
            h3 { font-size: 10pt; margin: 10pt 0 4pt; }
            table { width: 100%; border-collapse: collapse; margin-bottom: 6pt; }
            /* Keine erzwungenen Seitenumbrüche; nur verhindern, dass eine Tabellenzeile geteilt wird */
            tr { page-break-inside: avoid; }
            th, td { border: 1px solid #ccc; padding: 3pt 4pt; text-align: left; vertical-align: top; }
            th { background-color: #eef5ee; }
            td.right, th.right { text-align: right; white-space: nowrap; }
            tr.total td { font-weight: bold; background-color: #f5f5f5; }
            table.detail th { width: 35%; }
            p.leer { color: #777; font-style: italic; margin: 2pt 0 6pt; }
        </style>
    </head>
    <body>
        <h1 th:text="'Steuerrechnung ' + ${var.getJahr()}">Steuerrechnung</h1>
        <div th:replace="~{fragments/person :: person}"></div>
        <div th:replace="~{fragments/beruf :: beruf}"></div>
        <div th:replace="~{fragments/kosten :: kosten}"></div>
        <div th:replace="~{fragments/vergabung :: vergabung}"></div>
        <div th:replace="~{fragments/schuld :: schuld}"></div>
        <div th:replace="~{fragments/vermoegenswert :: vermoegenswert}"></div>
        <div th:replace="~{fragments/erbschaft :: erbschaft}"></div>
        <div th:replace="~{fragments/grundstueckunterhalt :: grundstueckunterhalt}"></div>
    </body>
</html>
